name: export-rkllm

# 两种触发方式:
#  1) 改了本文件就自动跑(推送即触发, 免得非要谁去网页上点 Run workflow);
#  2) Actions 页手动 Run workflow, 用 JSON 数组临时换模型/量化档。
# 默认组合写在 matrix 里 —— 想换组合就改这两行再推一次, 这就是我们的"下发任务"的地方。
#
# 量化档必须按芯片挑(官方 SDK 1.3.1 文档 p.19):
#   RK3588 只有 W8A8 / W8A8_G128 / W8A8_G256 / W8A8_G512, **没有 w4a16**;
#   w4a16 全系列只在 RK3576 / RV1126B / RK3562 上可用, 而且 grq 算法要求有 GPU。
on:
  workflow_dispatch:
    inputs:
      models:
        description: 'ModelScope 上的模型名, JSON 数组'
        required: false
        default: '["Qwen/Qwen2.5-1.5B-Instruct"]'
      dtypes:
        description: '量化档, JSON 数组(RK3588 只认 W8A8 系)'
        required: false
        default: '["W8A8"]'
  push:
    paths:
      - '.github/workflows/export.yml'

# 转换一跑就是几小时, 这里绝不能 cancel-in-progress: 之前它会把正在跑的 job 掐掉。
concurrency:
  group: export-rkllm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04          # 自带 python3.10, 与 rkllm_toolkit 的 cp310 wheel 对齐
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(github.event.inputs.models || '["Qwen/Qwen2.5-1.5B-Instruct"]') }}
        dtype: ${{ fromJSON(github.event.inputs.dtypes || '["W8A8"]') }}
    name: ${{ matrix.model }} · ${{ matrix.dtype }}
    env:
      MODEL: ${{ matrix.model }}
      DTYPE: ${{ matrix.dtype }}
      # 官方 benchmark.md 第 5 行要求用 0(性能优先); 1 是精度优先但会掉速度。
      # 想比较两种档就改这一行再推一次。
      OPTLEVEL: '0'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # wheel 只能人工从瑞芯微网盘拿到(已确认 PyPI 上没有 rkllm_toolkit)。
      # 首选: cp310 那个 .whl(7.2MB)直接当普通文件放在仓库根目录, 网页上传上限 25MB 装得下,
      #       这样全程不需要任何 token, CI 也不用额外下载。
      # 备选: 不想让 wheel 进 git 的话, 建一个 tag=rkllm-wheel 的 Release 把它当附件挂上, 下面会兜住。
      - name: 安装 rkllm wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          WHL=rkllm_toolkit-1.3.1-cp310-cp310-linux_x86_64.whl
          if [ ! -f "$WHL" ]; then
            echo "仓库根目录没有 $WHL, 改从 Release(tag=rkllm-wheel) 取"
            mkdir -p wheels
            gh release download rkllm-wheel --pattern '*.whl' -D wheels/ -c || true
            cp wheels/$WHL . || { echo "!! 两处都没有 cp310 wheel, 转换没法开始"; exit 1; }
          fi
          ls -la "$WHL"

      # requirements.txt 是 SDK 里那份原样拷进来的(transformers/torch 都是死-pin),
      # 自己随便 pip install -U 会装出不匹配的版本, 量化阶段直接报错。
      - name: 装依赖
        run: |
          set -e
          pip install -U pip wheel setuptools
          pip install "torch==2.6.0" "torchvision==0.21.0" \
              --index-url https://download.pytorch.org/whl/cpu
          # auto_gptq 只有源码包, 偶尔会在无 CUDA 的 runner 上编不过 —— Qwen 用不到它, 编不过就跳过
          pip install -r requirements.txt || {
            echo "!! 整包安装失败, 去掉 auto_gptq 重试";
            grep -v '^auto_gptq' requirements.txt > /tmp/reqs.txt;
            pip install -r /tmp/reqs.txt; }
          pip install --no-deps ./rkllm_toolkit-*-cp310-cp310-linux_x86_64.whl
          python -c "from rkllm.api import RKLLM; import transformers, torch; \
                     print('rkllm OK  transformers', transformers.__version__, ' torch', torch.__version__)"

      - name: 下载源模型
        run: |
          pip install -U modelscope
          modelscope download --model "$MODEL" --local_dir ./src
          du -sh ./src; ls -la ./src | head -20

      - name: 转换
        run: |
          set -o pipefail
          NAME=$(basename "$MODEL" | tr '.' '_')
          python export_rkllm.py --model ./src --name "$NAME" --dtype "$DTYPE" \
                                 --opt-level "${OPTLEVEL:-1}" \
                                 --max-context 2048 --out-dir ./out 2>&1 | tee conv.log
        env:
          HF_HUB_OFFLINE: '1'

      # Actions 的日志正文连公开仓库都要登录才能下(匿名 403), 出错只能看见"失败"两个字。
      # 所以失败时把转换日志用 CI 自带的 GITHUB_TOKEN 提交回仓库 logs/, 我匿名就能读。
      - name: 失败时回传转换日志
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          f="logs/$(basename "$MODEL" | tr '.' '_')-${DTYPE}-run${GITHUB_RUN_NUMBER}.txt"
          mkdir -p logs
          tail -c 400000 conv.log > "$f" 2>/dev/null || \
            echo "conv.log 不存在: 挂在转换之前的步骤, 去看 Actions 界面里的步骤名" > "$f"
          python -c "import base64,json,sys; p=sys.argv[1]; \
                     b=open(p,'rb').read()[-400000:]; \
                     json.dump({'message':'转换日志 '+p,'content':base64.b64encode(b).decode()}, \
                               open('/tmp/put.json','w'))" "$f"
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/$f" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$f" -f sha="$sha" --input /tmp/put.json
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$f" --input /tmp/put.json
          fi
          echo "日志已提交到 $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/main/$f" >> "$GITHUB_STEP_SUMMARY"

      # GitHub Release 单文件上限 2GB, 3B W8A8 约 3.3GB -> 分卷
      - name: 分卷并校验
        run: |
          cd out
          for f in *.rkllm; do
            md5sum "$f" | tee -a md5.txt
            big=$(stat -c %s "$f")
            if [ "$big" -gt 1900000000 ]; then
              split -b 1800m "$f" "$f.part_"
              rm -f "$f"
              for p in "$f".part_*; do md5sum "$p" | tee -a md5.txt; done
            fi
          done
          ls -la

      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          short=$(basename "$MODEL" | tr '.' '_')
          tag="rkllm-${short}-${DTYPE}-$(date +%Y%m%d-%H%M)"
          gh release create "$tag" out/* \
            --title "RKLLM $MODEL $DTYPE for RK3588" \
            --notes "由 Actions 生成。拼接与校验命令见仓库 README 的「拿回产物」一节。tag=$tag"
          echo "### Release: $tag" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json assets -q '.assets[].name' >> "$GITHUB_STEP_SUMMARY"
