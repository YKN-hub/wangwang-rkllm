name: export-rkllm

# 手动触发。矩阵里每个 dtype 各开一个 job —— 单次 CPU 量化 3B 可能 1~3 小时,
# 合在一个 job 里做两个会撞 GitHub Actions 单 job 6 小时上限。
on:
  workflow_dispatch:
    inputs:
      model:
        description: 'ModelScope 上的模型名'
        required: true
        default: 'Qwen/Qwen2.5-3B-Instruct'
        type: choice
        options:
          - 'Qwen/Qwen2.5-3B-Instruct'
          - 'Qwen/Qwen2.5-1.5B-Instruct'
      dtypes:
        description: '要转的量化档(逗号分隔)'
        required: true
        default: 'W4A16,W8A8'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04          # 自带 python3.10, 与 rkllm_toolkit 的 cp310 wheel 对齐
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        dtype: [W4A16, W8A8]
    name: ${{ github.event.inputs.model }} · ${{ matrix.dtype }}
    if: contains(github.event.inputs.dtypes, matrix.dtype)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # wheel 只能人工从 Rockchip 网盘拿到。为避免把 wheel 提交进 git(也避免 25MB 网页上传限制),
      # 做法是: 你在仓库建一个 tag 叫 rkllm-wheel 的 Release, 把 .whl 拖进去当附件。
      # 这样全程不需要任何个人 token —— Release 下载用 CI 自带的 GITHUB_TOKEN 就够了。
      - name: 安装 rkllm_toolkit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir -p wheels
          gh release download rkllm-wheel --pattern '*.whl' -D wheels/ -c
          ls wheels/*.whl >/dev/null || { echo "仓库里没有 tag=rkllm-wheel 的 Release, 或里面没有 .whl"; exit 1; }
          pip install -U pip wheel setuptools
          pip install wheels/rkllm_toolkit-*-cp310-cp310-linux_x86_64.whl
          python -c "from rkllm.api import RKLLM; print('rkllm 导入 OK')"

      - name: 装依赖
        run: pip install "torch>=2.1" transformers modelscope datasets "numpy<2" accelerate

      - name: 取校准数据集
        run: |
          curl -fsSL -o data_quant.json \
            https://raw.githubusercontent.com/airockchip/rknn-llm/main/examples/rkllm_api_demo/export/data_quant.json

      - name: 下载源模型
        run: |
          modelscope download --model "${{ github.event.inputs.model }}" --local_dir ./src
          du -sh ./src; ls -la ./src | head -20

      - name: 转换
        run: |
          python export_rkllm.py --model ./src --dtype ${{ matrix.dtype }} \
                                 --max-context 2048 --out-dir ./out
        env:
          HF_HUB_OFFLINE: '1'

      # GitHub Release 单文件上限 2GB, 3B W8A8 约 3.3GB -> 分卷
      - name: 分卷并校验
        run: |
          cd out
          for f in *.rkllm; do
            md5sum "$f" | tee -a md5.txt
            big=$(stat -c %s "$f")
            if [ "$big" -gt 1900000000 ]; then
              split -b 1800m "$f" "$f.part_"
              rm -f "$f"
              for p in "$f".part_*; do md5sum "$p" | tee -a md5.txt; done
            fi
          done
          ls -la

      - name: 发 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="rkllm-$(echo '${{ github.event.inputs.model }}' | tr '/' '-' | tr '.' '_' | cut -d/ -f2)-${{ matrix.dtype }}-$(date +%Y%m%d)"
          gh release create "$tag" out/* \
            --title "RKLLM ${{ github.event.inputs.model }} ${{ matrix.dtype }} for RK3588" \
            --notes "由 Actions 生成。拼接与校验命令见仓库 README 的「拿回产物」一节。tag=$tag"
          echo "### Release: $tag" >> "$GITHUB_STEP_SUMMARY"
          echo "下载列表:" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$tag" --json assets -q '.assets[].name' >> "$GITHUB_STEP_SUMMARY"
